<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Tehtävä</title>
</head>
<body>
    <p id="target"></p>
    <script>
      "use strict";
      const nimi = prompt("Mikä on nimesi?");
      document.querySelector("#target").innerHTML =
        "Hyvää huomenta, " + nimi + "!";
    </script>
</body>
</html>
